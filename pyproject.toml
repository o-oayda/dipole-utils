[project]
name = "dipole-utils"
version = "0.1.0"
description = "Utilities for fitting dipoles and higher order harmonics to healpy maps."
authors = [{ name = "Oliver Oayda", email = "oaydaoliver@gmail.com" }]
requires-python = ">=3.12"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "astropy>=7.1.0,<8.0.0",
    "scipy>=1.16.0,<2.0.0",
    "healpy>=1.18.1,<2.0.0",
    "ultranest>=4.4.0,<5.0.0",
    "corner>=2.2.3,<3.0.0",
    "h5py>=3.14.0,<4",
    "matplotlib>=3.10.3,<4",
    "numpy>=2.3.1,<3",
    "pyyaml>=6.0.2,<7",
    "ipython>=9.4.0,<10",
    "getdist>=1.7.1,<2",
    "dipoleska",
]

[dependency-groups]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0,<5.0.0",
]
dev = ["ipykernel>=6.29.5,<7"]

[tool.uv]
default-groups = "all"

[tool.uv.sources]
dipoleska = { git = "https://github.com/o-oayda/dipole-ska.git", rev = "build/relax-matplotlib-version" }

[tool.uv.build-backend]
module-name = ["dipoleutils"]
module-root = ""
source-include = [
    "dipoleutils/data/*.json",
    "dipoleutils/data/*.yaml",
    "dipoleutils/data/*.csv",
]

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"
