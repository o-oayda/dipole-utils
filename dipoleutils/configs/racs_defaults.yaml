# Fiducial RACS catalogue defaults.
#
# Mask entries are passed directly to Masker methods. Set a method to null to
# skip it. Simple mappings become keyword arguments, and list entries become
# positional arguments for repeated calls, e.g. mask_slice below.

low1:
  flux_column: total_flux_source
  flux_min: 15
  flux_max: 1000
  nside: 64
  coordinate_system: equatorial
  nest: false
  catalogue_operations:
    crossmatch_local_sources: null
  masks:
    mask_galactic_plane: {latitude_cut: 5}
    mask_equatorial_poles: {north_radius: 61, south_radius: 13}
    mask_ecliptic_poles: null
    mask_a_team_sources: null
    mask_slice:
      - [0.65, 18.4, 3]
      - [333.4, 19.1, 3]
      - [256.2, 5.1, 3]
      - [188.2, 11.2, 3]
      - [84.0, 22.0, 3]
      - [80.0, -70.0, 3]
    mask_equatorial_longitude: null
    mask_around_bright_sources: null

